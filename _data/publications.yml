- title: "Preventing neurodegenerative memory loss in Hopfield neuronal networks using cerebral organoids or external microelectronics"
  authors: "M. Morrison, P. Maia, and J. N. Kutz"
  venue: "Computational and Mathematical Methods in Medicine"
  details: "2017: 6102494"
  year: 2017
  status: published
  doi: "10.1155/2017/6102494"
  theme: neural
  image: hopfield.png
  summary: >-
